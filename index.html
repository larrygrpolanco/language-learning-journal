<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Journal</title>

    <!-- Installable. The manifest and icons are static files in public/, so a relative href works
         from a subpath, from file:// and inside a Tauri webview. Technical plan §12. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <meta name="theme-color" content="#f3f2f2" />
    <meta name="description" content="A journal for learning a language. Everything stays on this device." />
    <!-- iOS still reads these rather than the manifest for a home-screen launch. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Journal" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
