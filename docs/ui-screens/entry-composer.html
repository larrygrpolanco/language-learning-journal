<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Entry composer — desktop</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>body{margin:0;padding:40px;background:#e6e4e1}
.h{font-family:var(--font-heading);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700);margin:0 0 16px}
.dv-card{max-width:100%;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden}
.plate{box-sizing:border-box}</style>
</head><body>
<p class="h">Entry composer — desktop · ref 1c</p>
<div class="dv-card" style="width:820px">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-6);border-bottom:1px solid var(--color-divider)">
    <span style="font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)">시댁 한국어 · new entry</span>
    <span class="text-muted" style="font-size:12px">saved 2s ago</span>
  </div>
  <div style="display:grid;grid-template-columns:64px minmax(0,1fr)">
    <div style="border-right:1px solid var(--color-divider);padding:var(--space-4) 0;display:flex;flex-direction:column;align-items:center;gap:var(--space-2)">
      <button class="btn btn-icon btn-ghost" type="button" title="Attach"><i data-lucide="paperclip" style="width:17px;height:17px"></i></button>
      <button class="btn btn-icon btn-ghost" type="button" title="Add word"><i data-lucide="type" style="width:17px;height:17px"></i></button>
      <button class="btn btn-icon btn-ghost" type="button" title="Add sentence"><i data-lucide="quote" style="width:17px;height:17px"></i></button>
      <button class="btn btn-icon btn-ghost" type="button" title="Record"><i data-lucide="mic" style="width:17px;height:17px"></i></button>
    </div>
    <div style="padding:var(--space-6) var(--space-8) var(--space-4) var(--space-6)">
      <div style="display:flex;gap:var(--space-4);align-items:baseline;margin-bottom:var(--space-4)">
        <input class="input" value="Two hours at the kitchen table" style="border:0;border-bottom:1px solid var(--color-divider);border-radius:0;padding-left:0;font-family:var(--font-heading);font-size:24px;min-height:40px">
        <input class="input" value="dinner with in-laws" placeholder="source" style="width:190px;border:0;border-bottom:1px solid var(--color-divider);border-radius:0;font-size:13px;font-style:italic">
      </div>
      <div style="min-height:230px;font-size:15px;line-height:32px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,color-mix(in srgb,var(--color-text) 9%,transparent) 31px 32px)">Finally understood when 수고하셨습니다 is actually used — not as thanks, more like acknowledging someone's effort at the end of a thing. 어머님 kept softening things with 좀: <span style="border-bottom:2px solid var(--color-accent-300)">국물이 좀 짜지 않아요?</span><span style="display:inline-block;width:1px;height:18px;background:var(--color-accent);vertical-align:-3px;margin-left:2px"></span></div>
      <div style="display:flex;gap:var(--space-2);margin-top:var(--space-4);align-items:center">
        <div class="plate" style="width:76px;height:54px;background:repeating-linear-gradient(135deg,var(--color-neutral-200) 0 7px,var(--color-neutral-300) 7px 14px)"></div>
        <button class="btn btn-secondary" type="button" style="font-size:12.5px">+ attach</button>
      </div>
    </div>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-3) var(--space-6);border-top:1px solid var(--color-divider);background:var(--color-neutral-100)">
    <span style="font-size:12.5px;font-style:italic;color:var(--color-neutral-700)">Entry saves as you write.</span>
    <div style="display:flex;gap:var(--space-2)">
      <button class="btn btn-ghost" type="button">Reflect</button>
      <button class="btn btn-ghost" type="button">Extract</button>
      <button class="btn btn-primary" type="button">Done</button>
<script>lucide.createIcons();</script>
</body></html>
